openapi: 3.0.3
info:
  title: Homeward local API
  version: 1.0.0
  description: |
    HTTPS on the local network. Clients pin the SHA-256 digest of the server's DER
    certificate from the pairing QR payload. TLS 1.3 is required. All endpoints
    except pairing require the issued bearer token. Server responses include
    X-Library-ID; clients must reject unexpected library identities.
    JSON requests are limited to 64 KiB and unknown fields are rejected.
    Metadata length limits are enforced in UTF-8 bytes by the implementation.
    Media bodies are limited to 4 MiB per chunk. No media deletion endpoint exists.
servers:
  - url: https://{host}:{port}/v1
    variables:
      host:
        default: mac.local
      port:
        default: '8787'
security:
  - deviceToken: []
paths:
  /pair:
    post:
      operationId: pairDevice
      security: []
      summary: Exchange a one-use ten-minute pairing secret for a device credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secret, name]
              properties:
                secret:
                  type: string
                  minLength: 64
                  maxLength: 64
                name:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Paired; the secret has been consumed
          content:
            application/json:
              schema:
                type: object
                required: [token, library_id]
                properties:
                  token:
                    type: string
                    pattern: '^[a-f0-9]{64}$'
                  library_id:
                    type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          description: pairing_expired — missing, consumed, expired, or incorrect secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /status:
    get:
      operationId: getStatus
      summary: Read library identity and storage availability
      responses:
        '200':
          description: Storage available
          content:
            application/json:
              schema:
                type: object
                required: [library_id, free_bytes, reserve_bytes, protocol]
                properties:
                  library_id:
                    type: string
                  free_bytes:
                    type: integer
                    format: int64
                    description: Current filesystem free bytes, before subtracting active-upload reservations
                  reserve_bytes:
                    type: integer
                    format: int64
                    example: 5368709120
                  protocol:
                    type: integer
                    enum: [1]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /uploads:
    post:
      operationId: createUpload
      summary: Create or resume a content-addressed upload and record the source
      description: |
        Idempotent by full content SHA-256. Identical content shares an object;
        each device/source/version retains separate source metadata. An existing
        committed response is a stored status, not a fresh full-file rehash.
        The request can include Upload fields id/offset/state/path/error for wire
        compatibility; the server controls these fields and callers should omit them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpload'
      responses:
        '200':
          $ref: '#/components/responses/Upload'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '507':
          $ref: '#/components/responses/StorageFull'
  /uploads/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    get:
      operationId: getUpload
      summary: Query durable acknowledged offset and verification state
      responses:
        '200':
          $ref: '#/components/responses/Upload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /uploads/{id}/chunk:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    put:
      operationId: putChunk
      summary: Write a checked chunk and acknowledge only durable bytes
      description: |
        Use up to 4 MiB. A repeated already-acknowledged range is accepted only if
        the supplied checksum matches the existing durable bytes. Conflicting,
        overlapping, or nonsequential writes are rejected. After a lost response,
        query the upload offset before resuming. An acknowledged chunk is not a
        committed backup; full-file verification must finish separately.
      parameters:
        - in: header
          name: Upload-Offset
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - in: header
          name: Chunk-SHA256
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              minLength: 1
              maxLength: 4194304
      responses:
        '200':
          $ref: '#/components/responses/Upload'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: chunk_checksum — empty or checksum-mismatched chunk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '507':
          $ref: '#/components/responses/StorageFull'
  /uploads/{id}/finish:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    post:
      operationId: finishUpload
      summary: Begin independent whole-file verification and atomic publication
      description: |
        Requires offset == size. Repeated calls while verifying or committed are
        safe. Poll GET /uploads/{id}; HTTP 202 alone does not establish success.
      responses:
        '202':
          $ref: '#/components/responses/Upload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /backups/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    get:
      operationId: lookupBackup
      summary: Look up an object's persisted state, including incomplete uploads
      description: Does not independently rehash the stored bytes; use verify before cleanup.
      responses:
        '200':
          $ref: '#/components/responses/Upload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /backups/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    post:
      operationId: verifyBackup
      summary: Rehash the current original for cleanup eligibility
      description: |
        Synchronous streaming full-file verification, limited to two concurrent
        requests; additional requests receive 503 verification_busy. Requires a committed object. The client must independently
        rehash and version-check the current phone source and compare library,
        hash, and size before requesting Android's system Trash confirmation.
      responses:
        '200':
          description: The current stored file matches its expected hash and size
          content:
            application/json:
              schema:
                type: object
                required: [library_id, sha256, size, verified, verified_at]
                properties:
                  library_id:
                    type: string
                  sha256:
                    type: string
                    pattern: '^[a-f0-9]{64}$'
                  size:
                    type: integer
                    format: int64
                  verified:
                    type: boolean
                    enum: [true]
                  verified_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: 64-character lowercase hexadecimal token returned by POST /pair
  parameters:
    ObjectId:
      in: path
      name: id
      required: true
      description: Full source-content SHA-256; also the upload/object ID
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
  schemas:
    CreateUpload:
      type: object
      additionalProperties: false
      required: [sha256, size, source_id, version]
      properties:
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 1125899906842624
        source_id:
          type: string
          minLength: 1
          maxLength: 2048
        version:
          type: string
          minLength: 1
          maxLength: 1024
        name:
          type: string
          maxLength: 512
        mime:
          type: string
          maxLength: 256
        taken:
          type: integer
          format: int64
          description: Capture timestamp in Unix milliseconds; nonpositive means unknown
        folder:
          type: string
          maxLength: 2048
        id:
          type: string
          description: Ignored for newly created uploads; server derives from sha256
        offset:
          type: integer
          format: int64
          description: Ignored; server initializes to zero
        state:
          type: string
          description: Ignored; server initializes to uploading
        path:
          type: string
          description: Ignored; server chooses the destination
        error:
          type: string
          description: Ignored; server clears this value
        updated:
          type: integer
          format: int64
          description: Ignored; server sets its own last-update time
    Upload:
      type: object
      required: [id, sha256, size, offset, name, mime, taken, state, path, error]
      properties:
        id:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        size:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
          description: Durable acknowledged byte count, including while verifying
        name:
          type: string
        mime:
          type: string
          maxLength: 256
        taken:
          type: integer
          format: int64
        state:
          type: string
          enum: [uploading, verifying, committed, corrupt]
        path:
          type: string
          description: Relative original path when committed; empty before publication
        error:
          type: string
          description: Verification failure detail; normally empty
        updated:
          type: integer
          format: int64
          description: Optional last-persisted update timestamp in Unix seconds
    Error:
      type: object
      required: [error, message, retryable]
      properties:
        error:
          type: string
          description: Stable error code; see each operation's responses
        message:
          type: string
          description: Human-readable diagnostic
        retryable:
          type: boolean
          description: True for retry/wait conditions; false for requests requiring correction or action
  responses:
    Upload:
      description: Current persisted upload/object state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Upload'
    InvalidRequest:
      description: invalid_request, invalid_media, invalid_offset, or invalid_chunk
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: unauthorized — absent or unknown device token; pair again
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: not_found — no catalog object with this ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        size_conflict, integrity_error, invalid_offset, offset_conflict,
        incomplete, or not_committed. Inspect retryable and message; an integrity
        error must never be treated as successful backup or cleanup eligibility.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StorageUnavailable:
      description: drive_unavailable, storage_error, verification_busy, or server_busy — retain progress and retry/wait
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StorageFull:
      description: storage_full — free space cannot cover active reservations and 5 GiB reserve
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
